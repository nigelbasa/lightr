[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightr"
version = "0.2.0.dev0"
description = "A lightweight mail engine: SMTP, REST, and operator controls, with Dovecot as the mailbox server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nigel Basarokwe" }]
keywords = ["email", "smtp", "mail-server", "dovecot", "dkim"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email :: Mail Transport Agents",
]

dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "starlette>=0.37",
  "uvicorn[standard]>=0.30",
  "aiosmtpd>=1.4.6",
  "aiosmtplib>=3.0",
  "aioimaplib>=1.1",
  "dkimpy>=1.1",
  "pyspf>=2.0.14",
  "authres>=1.2",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "dnspython>=2.6",
  "cryptography>=42.0",
]

[project.optional-dependencies]
imap = ["aioimaplib>=1.1"]
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.29"]
ldap = ["ldap3>=2.9"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "aiosqlite>=0.20",
  "httpx>=0.27",
]

[project.scripts]
lightr = "lightr.cli.main:entrypoint"

[project.urls]
Homepage = "https://github.com/nigelbasa/lightr"
Documentation = "https://lightr.nigelbasa.tech"
Source = "https://github.com/nigelbasa/lightr"

[tool.hatch.build.targets.wheel]
packages = ["src/lightr"]
# Alembic needs its template and versions alongside the Python.
artifacts = ["src/lightr/migrations/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PTH", "RUF"]
ignore = ["A003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
files = ["src/lightr"]
