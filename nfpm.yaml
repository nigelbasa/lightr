# nfpm configuration for building deb/rpm/apk packages
# Install nfpm: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
# Build: nfpm package --packager deb --target dist/

name: lightr
arch: amd64
platform: linux
version: ${VERSION:-0.1.0}
section: mail
priority: optional
maintainer: Nigel Basa <nigel@example.com>
description: |
  Lightweight embeddable email server with SMTP, IMAP, and REST API.
  Features include DKIM signing, TLS support, email queue with retries,
  and optional advanced tenancy scoping.
vendor: Lightr
homepage: https://github.com/nigelbasa/lightr
license: MIT

contents:
  # Binary
  - src: ./dist/lightr-linux-amd64
    dst: /usr/bin/lightr
    file_info:
      mode: 0755

  # Systemd service
  - src: ./init/lightr.service
    dst: /lib/systemd/system/lightr.service
    file_info:
      mode: 0644

  # Example config
  - src: ./init/lightr.yaml.example
    dst: /etc/lightr/lightr.yaml.example
    file_info:
      mode: 0644

  # Create directories
  - dst: /var/lib/lightr
    type: dir
    file_info:
      mode: 0750
      owner: lightr
      group: lightr

  - dst: /var/lib/lightr/blobs
    type: dir
    file_info:
      mode: 0750
      owner: lightr
      group: lightr

  - dst: /var/lib/lightr/keys
    type: dir
    file_info:
      mode: 0700
      owner: lightr
      group: lightr

  - dst: /var/log/lightr
    type: dir
    file_info:
      mode: 0750
      owner: lightr
      group: lightr

  - dst: /etc/lightr/certs
    type: dir
    file_info:
      mode: 0700
      owner: root
      group: lightr

scripts:
  postinstall: ./scripts/postinstall.sh
  preremove: ./scripts/preremove.sh

overrides:
  deb:
    depends:
      - ca-certificates
  rpm:
    depends:
      - ca-certificates
  apk:
    depends:
      - ca-certificates
