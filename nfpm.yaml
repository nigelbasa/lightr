# nfpm packaging for the .deb.
#
# The package depends on Dovecot: Lightr does not serve IMAP, so an
# install without it has no mailboxes. dovecot-sqlite is the one that
# is easy to miss -- Dovecot starts fine without it and only fails at
# delivery time, with "Unknown database driver", which points at
# nothing. Postgres installs also need dovecot-pgsql; `lightr
# preflight` names it.
name: lightr
arch: all
platform: linux
version: ${VERSION}
section: mail
priority: optional
maintainer: Nigel Basarokwe
description: |
  A lightweight mail engine.
  SMTP receive, submission and relay, DKIM/SPF/DMARC, an operator REST
  API and CLI. Mailboxes are served by Dovecot.
vendor: lightr
homepage: https://github.com/nigelbasa/lightr
license: MIT

depends:
  - python3 (>= 3.11)
  - python3-venv
  - dovecot-core
  - dovecot-imapd
  - dovecot-lmtpd
  - dovecot-sieve
  - dovecot-sqlite
suggests:
  - dovecot-pgsql
  - postgresql-client
  - rspamd

contents:
  - src: ./dist/lightr
    dst: /usr/bin/lightr
    file_info:
      mode: 0755

  # The bundled interpreter. Shipped whole so a system pip install
  # cannot change what the mail engine runs.
  - src: ./dist/deb-root/opt/lightr/venv
    dst: /opt/lightr/venv

  - src: ./packaging/systemd/lightr.service
    dst: /lib/systemd/system/lightr.service

  - src: ./lightr.yaml.example
    dst: /usr/share/doc/lightr/config.yaml.example

  - dst: /var/lib/lightr
    type: dir
    file_info:
      mode: 0750
      owner: lightr
      group: lightr

  - dst: /var/mail/lightr
    type: dir
    file_info:
      mode: 02770
      owner: lightr
      group: lightr

  # /etc/lightr/config.yaml is written by `lightr setup` in postinst,
  # not shipped as a conffile: it gains generated secrets on first
  # setup, and a conffile dpkg believes it owns would prompt about
  # "local changes" on every upgrade for a file the package itself
  # caused to differ.
  - src: ./lightr.yaml.example
    dst: /etc/lightr/config.yaml.example
    type: config|noreplace

scripts:
  postinstall: ./packaging/debian/postinst
  preremove: ./packaging/debian/prerm
  postremove: ./packaging/debian/postrm
