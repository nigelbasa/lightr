# Lightr Minimal Configuration
# This file now uses the same shape as the primary config example.

data_dir: /var/lib/lightr

server:
  hostname: mail.yourdomain.com
  bind_address: 0.0.0.0

database:
  driver: sqlite
  path: /var/lib/lightr/lightr.db

http:
  addr: ":8080"

api:
  admin_key: "CHANGE_ME_generate_a_random_key"

smtp:
  addr: ":25"
  submission_addr: ":587"
  max_message_bytes: 26214400
  max_recipients: 100
  allow_insecure: false

imap:
  addr: ":143"
  tls_addr: ":993"
  allow_insecure: false

dkim:
  selector: default
  key_bits: 2048

security:
  require_tls_for_auth: true

logging:
  level: info
  file: /var/log/lightr/lightr.log
